lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      typescript:
        specifier: ^5.6.0
        version: 5.6.3

  packages/web:
    dependencies:
      react:
        specifier: ^19.0.0
        version: 19.1.0
      '@types/react':
        specifier: ^19.0.0
        version: 19.1.0

  packages/api:
    dependencies:
      express:
        specifier: ^4.21.0
        version: 4.21.2
      '@types/node':
        specifier: ^22.0.0
        version: 22.10.0

packages:

  typescript@5.6.3:
    resolution: {integrity: sha512-typescript5.6.3}
    engines: {node: '>=14.17'}

  react@19.1.0:
    resolution: {integrity: sha512-react19.1.0}

  '@types/react@19.1.0':
    resolution: {integrity: sha512-types-react19.1.0}

  express@4.21.2:
    resolution: {integrity: sha512-express4.21.2}

  '@types/node@22.10.0':
    resolution: {integrity: sha512-types-node22.10.0}

  '@types/node@22.10.1':
    resolution: {integrity: sha512-types-node22.10.1}

snapshots:

  typescript@5.6.3: {}

  react@19.1.0:
    dependencies:
      loose-envify: 1.4.0

  '@types/react@19.1.0':
    dependencies:
      csstype: 3.1.3

  express@4.21.2:
    dependencies:
      accepts: 1.3.8
      body-parser: 1.20.3

  '@types/node@22.10.0':
    dependencies:
      undici-types: 6.20.0