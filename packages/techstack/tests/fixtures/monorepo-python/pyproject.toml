[project]
name = "monorepo-python"
version = "0.0.1"
description = "Test fixture: Python project with pyproject.toml + requirements.txt"
requires-python = ">=3.10"
dependencies = [
    "django>=5.2,<6.0",
    "requests>=2.32,<3.0",
    "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"