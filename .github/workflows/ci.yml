name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch/PR — no point testing stale code.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependency audit runs as its own job so an unrelated new advisory (or a
  # registry hiccup) fails with a clear, separate signal instead of masking
  # the build/typecheck/test result of the change under review. `pnpm audit`
  # only reads the lockfile, so no install/build is needed here.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (resolved 2026-05-29)
        with:
          node-version: 22

      # Security: fail CI on known dependency vulnerabilities (moderate+).
      # Low/informational findings pass through.
      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

  ci:
    # Matrix: ubuntu-latest (existing) + windows-latest (J-area coverage).
    # The project claims Windows support in its lockstep-release story
    # (publishes to npm on 3 platforms per docs/zero-report.md), but
    # CI has historically run only on Linux, leaving Windows-specific
    # code paths (shell escaping, path handling, line-ending) unverified
    # until release day. Adding windows-latest here exposes those
    # failures at PR time, where they're cheap to fix. macos-latest
    # is intentionally not included — start with the most user-relevant
    # OS (Windows) and add others if Windows coverage proves valuable.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (resolved 2026-05-29)
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      # Cache the Playwright Chromium download (~150 MB per OS). Keyed on the
      # resolved @playwright/test version, so the cache survives unrelated
      # lockfile churn and invalidates exactly when the browser revision can
      # change. On a hit, `--install` sees the executable and exits fast;
      # `--with-deps` still runs on Linux because apt packages are not cached.
      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install first-party browser (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: node scripts/check-browser-runtime.mjs --install --with-deps

      - name: Install first-party browser (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: node scripts/check-browser-runtime.mjs --install

      - name: Smoke test first-party browser
        run: node scripts/check-browser-runtime.mjs --smoke

      # node-pty prebuilt smoke check. Catches pnpm 11 + Node 22/24 +
      # optionalDependencies regressions that the rest of CI misses
      # because vitest never actually loads the native binary (it just
      # mocks require). Must run after install (which fetches the
      # prebuilt) and before build (so a broken optional dep fails
      # fast, before we spend 60 s compiling 22 packages).
      # See scripts/check-node-pty.mjs for the rationale.
      - name: Smoke test node-pty prebuilt
        run: pnpm check:node-pty

      # Build all workspace packages in dependency (topological) order before
      # typechecking. Each package resolves its `@wrongstack/*` imports from a
      # dependency's *emitted* dist/*.d.ts, so without this step downstream
      # packages (e.g. @wrongstack/acp -> @wrongstack/core) fail with
      # TS2307 "Cannot find module '@wrongstack/core' or its corresponding
      # type declarations". `pnpm build` runs scripts/build.mjs, which topo-sorts.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Flag distributive-conditional Omit<>/Pick<> usages for review.
      # Advisory (the script exits 0); running it in CI surfaces the report
      # in the logs on every PR without blocking.
      - name: Lint distributive types
        run: pnpm lint:distributive

      # Syntax-check the shell scripts (bash -n). Runs under the default
      # GitHub Actions bash shell, which is available on both ubuntu-latest
      # and windows-latest (Git Bash), so this is cross-platform safe.
      - name: Lint shell scripts
        run: pnpm lint:scripts

      # Block ad-hoc console.warn/error string-literal logging. The project
      # convention is structured JSON logging —
      # console.(warn|error)(JSON.stringify({ level, event, message, timestamp })).
      # scripts/lint-console-logging.mjs --all scans every tracked TS file and
      # exits non-zero on violations, so new ad-hoc calls fail the PR before merge.
      - name: Lint console logging
        run: pnpm lint:console

      - name: Check translation completeness
        run: pnpm lint:i18n

      # Step-level timeout below the 30-minute job cap: vitest on POSIX
      # runners has a known failure mode where a leaked handle keeps the
      # process alive after the suite finishes. A hung test run should be
      # reported as "Test timed out", not as an opaque job-level kill.
      - name: Test
        timeout-minutes: 20
        run: pnpm test
