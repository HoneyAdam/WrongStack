name: Release

# Triggers on version tags (e.g. v0.278.0). Manual dispatch is limited
# to dry-runs against main; npm publication always requires a tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# Cancel in-flight runs for the same tag — no point releasing stale
# code. workflow_dispatch runs are not cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Tag pushes publish after validation; manual dispatches only run
    # the same gates and a package dry-run.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Tag-push runs only fire on tag refs, but workflow_dispatch can
    # target any branch. The validation step constrains manual runs to
    # main and verifies that a release tag's commit belongs to main.

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          # Tag pushes need full history for semver/audit, and
          # the lockfile lives at the repo root.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (resolved 2026-05-29)
        with:
          node-version: 22
          cache: pnpm

      - name: Validate release ref and version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::Manual release validation must run from main (got $REF)."
              exit 1
            fi
            echo "::notice::Manual run on main will perform a dry-run only."
            exit 0
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "$REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag $REF_NAME does not match package.json version $EXPECTED_TAG."
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release commit $GITHUB_SHA is not contained in origin/main."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install and smoke test first-party browser
        run: |
          node scripts/check-browser-runtime.mjs --install --with-deps
          node scripts/check-browser-runtime.mjs --smoke

      # Build all packages so `tsc --noEmit` during typecheck can
      # find cross-package declarations (e.g. packages/bench
      # imports @wrongstack/core and needs core/dist/index.d.ts).
      # Without this step, `pnpm -r typecheck` fails on packages
      # that import another workspace package.
      - name: Build workspace packages
        run: pnpm build

      # Layer 1 — broad correctness sweep. Mirrors the local
      # `pnpm release:check` script: audit + typecheck + build + test.
      - name: Layer 1 — release:check (audit + typecheck + build + test)
        run: pnpm release:check

      # Layer 2 — narrow invariant guards. Mirrors `pnpm prepublishOnly`
      # which npm fires automatically before `pnpm publish`. We run it
      # explicitly here so the gate fires even if `pnpm publish` is
      # bypassed at the CI level (e.g. someone swaps the publish step
      # for a direct registry upload).
      - name: Layer 2 — prepublishOnly (catalog + H1 teardown + smoke)
        run: pnpm prepublishOnly

      # Publish step. The npm/pnpm lifecycle auto-runs `prepublishOnly`
      # AGAIN before the actual upload — so Layer 2 fires twice in
      # CI (explicit step + automatic). That's intentional belt-and-
      # braces: the explicit step is documented and visible in the
      # GitHub Actions UI; the automatic one is the standard npm
      # safety net.
      - name: Package dry-run
        if: github.event_name == 'workflow_dispatch'
        run: pnpm release:dry

      - name: Publish to npm
        if: github.event_name == 'push'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm release
